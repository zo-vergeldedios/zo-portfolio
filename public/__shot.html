<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a0a; }
      iframe { border: 0; width: 100vw; height: 100vh; display: block; }
    </style>
  </head>
  <body>
    <iframe id="f" src="/"></iframe>
    <script>
      var params = new URLSearchParams(location.search);
      var target = params.get('s');
      var offset = parseInt(params.get('o') || '0', 10);
      var f = document.getElementById('f');
      f.addEventListener('load', function () {
        setTimeout(function () {
          var d = f.contentDocument;
          d.documentElement.style.scrollBehavior = 'auto';
          if (target) {
            var el = d.getElementById(target);
            if (el) el.scrollIntoView();
          }
          if (offset) f.contentWindow.scrollBy(0, offset);
        }, 2500);
      });
    </script>
  </body>
</html>
